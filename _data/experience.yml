- company: "Bear Robotics"
  role: "서빙로봇 회사에서 System팀 인턴으로 근무 했습니다."
  period: "2024.09 - 2025.08"
  highlights:
    - title: "SSD 암호화"
      desc: "SSD 탈취 방지 및 데이터 보호를 위해 TPM 보안 모듈을 활용한 SSD 암호화 프로젝트를 진행했습니다."
      link: "https://github.com/song-dela-moon/Rust-TPM"
    - title: "zRAM Swap 도입"
      desc: "로봇이 대형 매장 지도를 안정적으로 로드할 수 있도록 zRAM Swap을 도입하여 메모리 성능과 Disk 수명을 확보했습니다."
      link: "https://github.com/song-dela-moon/Simple-zRAM"
    - title: "성능 자동화"
      desc: "맵 최대 크기 계산 및 성능 지표 생성 자동화 프로젝트를 수행했습니다."
    - title: "Pipewire 전환"
      desc: "다중 오디오 재생 지원을 위해 기존 1:1 ALSA 방식을 Pipewire 체계로 전환했습니다."
      link: "https://github.com/song-dela-moon/Linux-Audio-System"
    - title: "OS 업데이트"
      desc: "Ostree와 OverlayFS를 활용한 OS 버전 업데이트 프로젝트를 지원했습니다."
    - title: "현장 지원"
      desc: "고객 대상 로봇 배포/교육 및 생산 공장 OS 설치 환경 구축을 지원했습니다."

- company: "로디언즈"
  role: "가상 자산 지갑 서비스 스타트업에서 Infra팀 인턴으로 근무 했습니다."
  period: "2021.08 - 2021.12"
  highlights:
    - title: "Okta 도입"
      desc: "ISMS-P 인증의 MFA 요구사항 충족을 위해 Okta를 도입 및 적용했습니다."
    - title: "ISMS-P 대응"
      desc: "ISMS-P 심사 대응 및 인증 보완 과정을 지원했습니다."
    - title: "CI/CD 구축"
      desc: "Kubernetes, Docker, Jenkins를 활용하여 배포 자동화를 위한 파이프라인을 구축했습니다."
    - title: "모니터링"
      desc: "Prometheus와 Grafana를 활용한 서버 모니터링 시스템을 운영했습니다."

- company: "선린인터넷고등학교"
  role: "4년간 6번의 방학 동안 방과 후 학교 교사로 근무 했습니다."
  period: "2020.08 - 2023.08"
  highlights:
    - title: "네트워크 강의"
      desc: "리눅스/윈도우 기반 서비스(DHCP, DNS 등) 제공 과정을 교육했습니다."
    - title: "실습 교육"
      desc: "Cisco 실장비 및 Packet Tracer로 서브네팅, 라우팅(OSPF 등), 스위칭(STP) 등을 실습 위주로 교육했습니다."
    - title: "대회 지원"
      desc: "교내 네트워크 및 서버 구축 대회의 문제 출제를 담당했습니다."
