<article class="post-card project-card-modern" id="project-{{ project.title | slugify }}">
  <div class="post-card-link">
    <div class="post-card-image">
      {% if project.image %}
      <img src="{{ project.image | relative_url }}" alt="{{ project.title }}" loading="lazy">
      {% else %}
      <div class="post-card-image-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
        </svg>
      </div>
      {% endif %}
    </div>

    <div class="post-card-body">
      <div class="post-card-categories">
        <span class="category-badge">Project</span>
      </div>

      <h2 class="post-card-title">{{ project.title }}</h2>
      <p class="post-card-excerpt">{{ project.description }}</p>

      <div class="post-card-meta">
        <span class="mono" style="font-size: 0.75rem;">{{ project.period }}</span>
        <div class="post-card-tags">
          {% for tag in project.tags %}
          <span class="tag">#{{ tag }}</span>
          {% endfor %}
        </div>
      </div>

      {% if project.github %}
      <div class="project-card-footer" style="margin-top: 16px;">
        <a href="{{ project.github }}" class="btn btn-outline" target="_blank" rel="noopener" style="font-size: 0.75rem; padding: 6px 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub Repository
        </a>
      </div>
      {% endif %}
    </div>
  </div>
</article>
